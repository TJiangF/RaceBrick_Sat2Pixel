<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RaceBrick Sat2Pixel — 240×240 压缩预览</title>
<style>
  :root {
    --bg: #14161a; --panel: #1e2126; --border: #2c313a;
    --text: #d7dae0; --muted: #8a919c; --accent: #3b82f6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  #app { display: flex; height: 100vh; }
  #map-wrap { flex: 1; position: relative; overflow: hidden; cursor: grab; }
  #map-wrap.dragging { cursor: grabbing; }
  canvas { position: absolute; inset: 0; }
  #hud { position: absolute; left: 12px; bottom: 12px; background: rgba(0,0,0,.55);
    color: #fff; font-size: 12px; padding: 6px 10px; border-radius: 6px; pointer-events: none; }
  #zoom { position: absolute; top: 12px; right: 12px; display: flex; flex-direction: column; gap: 6px; }
  #zoom button { width: 34px; height: 34px; font-size: 20px; line-height: 1;
    background: rgba(0,0,0,.55); color: #fff; border: 1px solid rgba(255,255,255,.2);
    border-radius: 6px; cursor: pointer; padding: 0; }
  #zoom button:hover { background: rgba(59,130,246,.8); }
  #sidebar { width: 330px; background: var(--panel); border-left: 1px solid var(--border);
    overflow-y: auto; padding: 16px; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  .sub { font-size: 11px; color: var(--muted); margin-bottom: 16px; }
  .block { margin-bottom: 18px; }
  .block h2 { font-size: 12px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .5px; margin: 0 0 8px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  #search { display: flex; gap: 6px; position: relative; }
  #suggest { position: absolute; top: calc(100% + 4px); left: 0; right: 0;
    background: #14161a; border: 1px solid var(--border); border-radius: 6px;
    max-height: 240px; overflow-y: auto; z-index: 20; display: none; }
  .suggest-item { padding: 7px 10px; cursor: pointer; font-size: 13px; }
  .suggest-item:hover, .suggest-item.active { background: #2a2f38; }
  .suggest-item .d { color: var(--muted); font-size: 11px; margin-top: 1px; }
  #address { flex: 1; background: #14161a; border: 1px solid var(--border); color: var(--text);
    padding: 7px 9px; border-radius: 6px; font-size: 13px; }
  button { background: var(--accent); color: #fff; border: none; padding: 7px 12px;
    border-radius: 6px; font-size: 13px; cursor: pointer; }
  button:hover { filter: brightness(1.1); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-bottom: 8px; font-size: 13px; }
  .row label { color: var(--muted); min-width: 80px; }
  .row .val { color: var(--text); font-variant-numeric: tabular-nums; min-width: 40px; text-align: right; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  select { flex: 1; background: #14161a; border: 1px solid var(--border); color: var(--text);
    padding: 5px 8px; border-radius: 6px; font-size: 13px; }
  .checkbox { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 8px; }
  .checkbox input { accent-color: var(--accent); }
  #previewWrap { position: relative; border: 1px solid var(--border); border-radius: 6px;
    background: #0c0d0f; padding: 6px; }
  #previewImg { width: 100%; display: block; image-rendering: pixelated; }
  #previewStats { font-size: 11px; color: var(--muted); margin-top: 6px; line-height: 1.6; }
  .btns { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .btns button { flex: 1; font-size: 12px; padding: 6px 8px; }
  #status { font-size: 11px; color: var(--muted); margin-top: 8px; min-height: 14px; }
</style>
</head>
<body>
<div id="app">
  <div id="map-wrap">
    <canvas id="map"></canvas>
    <div id="hud">加载中…</div>
    <div id="zoom">
      <button id="zoomIn" title="放大">+</button>
      <button id="zoomOut" title="缩小">−</button>
    </div>
  </div>
  <div id="sidebar">
    <h1>RaceBrick Sat2Pixel</h1>
    <div class="sub">卫星图 → ≤240×240 高效压缩（拖动地图 / 滚轮缩放）</div>

    <div class="block">
      <h2>地址搜索</h2>
      <div id="search">
        <input id="address" placeholder="输入地址，如：上海交通大学徐汇校区" autocomplete="off" />
        <button id="go">搜索</button>
        <div id="suggest"></div>
      </div>
    </div>

    <div class="block">
      <h2>显示</h2>
      <div class="checkbox"><input type="checkbox" id="showOverlay" checked /> 叠加压缩结果</div>
      <div class="row">
        <label>透明度</label>
        <input type="range" id="opacity" min="0" max="100" value="100" />
        <span class="val" id="opacityVal">100%</span>
      </div>
      <div class="checkbox"><input type="checkbox" id="baseLabels" /> 底图叠加路网标注</div>
    </div>

    <div class="block">
      <h2>压缩</h2>
      <div class="row">
        <label>最大边长</label>
        <input type="range" id="maxSize" min="64" max="480" step="8" value="240" />
        <span class="val" id="maxSizeVal">240</span>
      </div>
      <div class="row"><label>缩放算法</label>
        <select id="method">
          <option value="lanczos" selected>Lanczos（最清晰）</option>
          <option value="box">Box（面积平均）</option>
          <option value="bilinear">Bilinear（双线性）</option>
          <option value="nearest">Nearest（最近邻）</option>
        </select>
      </div>
      <div class="row">
        <label>锐化</label>
        <input type="range" id="sharpen" min="0" max="2.0" step="0.1" value="0.4" />
        <span class="val" id="sharpenVal">0.4</span>
      </div>
      <div class="row"><label>格式</label>
        <select id="format">
          <option value="png" selected>PNG（无损）</option>
          <option value="jpeg">JPEG（最小）</option>
          <option value="rgb565">RGB565（MCU 直显）</option>
        </select>
      </div>
      <div class="row">
        <label>JPEG 质量</label>
        <input type="range" id="quality" min="1" max="100" value="85" />
        <span class="val" id="qualityVal">85</span>
      </div>
    </div>

    <div class="block">
      <h2>预览</h2>
      <div id="previewWrap"><img id="previewImg" alt="preview" /></div>
      <div id="previewStats">—</div>
      <div class="btns">
        <button id="dlPng">PNG</button>
        <button id="dlJpeg">JPEG</button>
        <button id="dlRgb565">RGB565</button>
      </div>
      <div id="status"></div>
    </div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('map');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('map-wrap');
  const hud = document.getElementById('hud');

  const state = {
    lng: 121.43375,
    lat: 31.19875,
    zoom: 17,
    baseStyle: 6,
    overlay: null,
    showOverlay: true,
    opacity: 1.0,
  };
  const tiles = new Map();
  const MAX_TILES = 400;
  let overlayUrl = null, previewUrl = null;

  function worldX(lng) { return (lng + 180) / 360; }
  function worldY(lat) {
    const r = lat * Math.PI / 180;
    return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2;
  }
  function lngFromWorld(x) { return x * 360 - 180; }
  function latFromWorld(y) {
    const n = Math.PI * (1 - 2 * y);
    return (180 / Math.PI) * (2 * Math.atan(Math.exp(n)) - Math.PI / 2);
  }
  const scale = () => 256 * Math.pow(2, state.zoom);

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const w = wrap.clientWidth, h = wrap.clientHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { w, h };
  }

  function viewport() {
    const { w, h } = resize();
    const cx = worldX(state.lng) * scale();
    const cy = worldY(state.lat) * scale();
    return { w, h, topLeftX: cx - w / 2, topLeftY: cy - h / 2 };
  }

  function tileKey(z, x, y) { return z + '/' + x + '/' + y; }
  function ensureTile(z, x, y) {
    const key = tileKey(z, x, y);
    let t = tiles.get(key);
    if (t) { tiles.delete(key); tiles.set(key, t); return t; }
    t = { img: new Image(), loaded: false };
    t.img.onload = () => { t.loaded = true; draw(); };
    t.img.src = 'https://webst0' + (((x + y) % 4) + 1) + '.is.autonavi.com/appmaptile?style=' +
      state.baseStyle + '&x=' + x + '&y=' + y + '&z=' + z;
    tiles.set(key, t);
    if (tiles.size > MAX_TILES) tiles.delete(tiles.keys().next().value);
    return t;
  }

  function draw() {
    const { w, h, topLeftX, topLeftY } = viewport();
    ctx.clearRect(0, 0, w, h);
    const z = state.zoom;
    const x0 = Math.floor(topLeftX / 256), x1 = Math.floor((topLeftX + w) / 256);
    const y0 = Math.floor(topLeftY / 256), y1 = Math.floor((topLeftY + h) / 256);
    for (let x = x0; x <= x1; x++) {
      for (let y = y0; y <= y1; y++) {
        const t = ensureTile(z, x, y);
        if (t.loaded) ctx.drawImage(t.img, x * 256 - topLeftX, y * 256 - topLeftY, 256, 256);
      }
    }
    if (state.showOverlay && state.overlay) {
      ctx.globalAlpha = state.opacity;
      ctx.drawImage(state.overlay, 0, 0, w, h);
      ctx.globalAlpha = 1;
    }
    hud.textContent = '中心 ' + state.lng.toFixed(5) + ', ' + state.lat.toFixed(5) + ' · zoom ' + state.zoom;
  }

  function corners() {
    const { w, h, topLeftX, topLeftY } = viewport();
    const nwLng = lngFromWorld(topLeftX / scale());
    const nwLat = latFromWorld(topLeftY / scale());
    const seLng = lngFromWorld((topLeftX + w) / scale());
    const seLat = latFromWorld((topLeftY + h) / scale());
    return [
      { lng: nwLng, lat: seLat },
      { lng: seLng, lat: seLat },
      { lng: seLng, lat: nwLat },
      { lng: nwLng, lat: nwLat },
    ];
  }

  function options() {
    return {
      max_size: +document.getElementById('maxSize').value,
      method: document.getElementById('method').value,
      sharpen: +document.getElementById('sharpen').value,
      quality: +document.getElementById('quality').value,
    };
  }

  function fmtBytes(n) {
    if (n >= 1024) return (n / 1024).toFixed(1) + 'KB';
    return n + 'B';
  }

  let reqSeq = 0;
  async function requestPreview(format) {
    const mySeq = ++reqSeq;
    const body = Object.assign({ corners: corners(), zoom: state.zoom }, options());
    if (format) body.format = format;
    document.getElementById('status').textContent = '处理中…';
    try {
      const resp = await fetch('/api/preview', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (mySeq !== reqSeq) return null;
      if (!resp.ok) { document.getElementById('status').textContent = '错误 ' + resp.status; return null; }
      const blob = await resp.blob();
      if (mySeq !== reqSeq) return null;
      const w = resp.headers.get('X-Preview-Width');
      const h = resp.headers.get('X-Preview-Height');
      const png = resp.headers.get('X-Preview-Png');
      const jpeg = resp.headers.get('X-Preview-Jpeg');
      const rgb565 = resp.headers.get('X-Preview-Rgb565');

      if (format) {
        document.getElementById('status').textContent = '已下载 ' + w + '×' + h;
        return blob;
      }

      // preview (PNG)
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => { state.overlay = img; draw(); };
      img.src = url;
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = url;
      document.getElementById('previewImg').src = url;
      document.getElementById('previewStats').innerHTML =
        '<b>' + w + '×' + h + '</b> · PNG ' + fmtBytes(+png) +
        ' · JPEG ' + fmtBytes(+jpeg) + ' · RGB565 ' + fmtBytes(+rgb565);
      document.getElementById('status').textContent = '完成 · zoom ' + state.zoom;
      return blob;
    } catch (e) {
      if (mySeq === reqSeq) document.getElementById('status').textContent = '请求失败';
      return null;
    }
  }

  function download(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }
  document.getElementById('dlPng').addEventListener('click', async () => {
    const b = await requestPreview('png'); if (b) download(b, 'sat2pixel.png');
  });
  document.getElementById('dlJpeg').addEventListener('click', async () => {
    const b = await requestPreview('jpeg'); if (b) download(b, 'sat2pixel.jpg');
  });
  document.getElementById('dlRgb565').addEventListener('click', async () => {
    const b = await requestPreview('rgb565'); if (b) download(b, 'sat2pixel.rgb565');
  });

  let debounce = null;
  function schedulePreview() {
    clearTimeout(debounce);
    debounce = setTimeout(() => requestPreview(), 150);
  }

  // pan / zoom
  let dragging = false, lastX = 0, lastY = 0;

  function zoomBy(dir) {
    const next = Math.max(2, Math.min(18, state.zoom + dir));
    if (next === state.zoom) return;
    state.zoom = next;
    draw();
    schedulePreview();
  }
  document.getElementById('zoomIn').addEventListener('click', () => zoomBy(1));
  document.getElementById('zoomOut').addEventListener('click', () => zoomBy(-1));
  wrap.addEventListener('pointerdown', (e) => {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    wrap.classList.add('dragging'); wrap.setPointerCapture(e.pointerId);
  });
  wrap.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    state.lng = lngFromWorld((worldX(state.lng) * scale() - dx) / scale());
    state.lat = latFromWorld((worldY(state.lat) * scale() - dy) / scale());
    draw();
  });
  wrap.addEventListener('pointerup', () => { dragging = false; wrap.classList.remove('dragging'); schedulePreview(); });

  document.getElementById('showOverlay').addEventListener('change', (e) => {
    state.showOverlay = e.target.checked; draw();
  });
  document.getElementById('opacity').addEventListener('input', (e) => {
    state.opacity = +e.target.value / 100;
    document.getElementById('opacityVal').textContent = e.target.value + '%';
    draw();
  });
  document.getElementById('baseLabels').addEventListener('change', (e) => {
    state.baseStyle = e.target.checked ? 8 : 6;
    tiles.clear(); draw();
  });

  const bindings = [
    ['maxSize', 'maxSizeVal'], ['sharpen', 'sharpenVal'], ['quality', 'qualityVal'],
  ];
  for (const [id, valId] of bindings) {
    const el = document.getElementById(id), v = document.getElementById(valId);
    v.textContent = el.value;
    el.addEventListener('input', () => { v.textContent = el.value; schedulePreview(); });
  }
  document.getElementById('method').addEventListener('change', schedulePreview);
  document.getElementById('format').addEventListener('change', schedulePreview);

  // search + autocomplete
  const addressEl = document.getElementById('address');
  const suggestEl = document.getElementById('suggest');
  let tips = [], active = -1;

  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function hideSuggest() { suggestEl.style.display = 'none'; active = -1; }
  function renderSuggest(list) {
    tips = list; active = -1;
    suggestEl.innerHTML = '';
    if (!list.length) { hideSuggest(); return; }
    list.forEach((t, i) => {
      const d = document.createElement('div');
      d.className = 'suggest-item';
      const sub = [t.district, t.address].filter(Boolean).join(' · ');
      d.innerHTML = '<div>' + escapeHtml(t.name) + '</div>' + (sub ? '<div class="d">' + escapeHtml(sub) + '</div>' : '');
      d.addEventListener('mousedown', (e) => { e.preventDefault(); selectTip(t); });
      d.addEventListener('mouseenter', () => setActive(i));
      suggestEl.appendChild(d);
    });
    suggestEl.style.display = 'block';
  }
  function setActive(i) {
    active = i;
    Array.from(suggestEl.children).forEach((c, j) => c.classList.toggle('active', j === i));
  }
  function selectTip(t) {
    addressEl.value = t.name;
    hideSuggest();
    state.lng = t.lng; state.lat = t.lat; state.zoom = 17;
    draw(); schedulePreview();
    document.getElementById('status').textContent = [t.district, t.address].filter(Boolean).join(' · ') || t.name;
  }

  document.getElementById('go').addEventListener('click', doSearch);
  let tipSeq = 0, tipDebounce = null;
  addressEl.addEventListener('input', (e) => {
    const kw = e.target.value.trim();
    clearTimeout(tipDebounce);
    if (!kw) { hideSuggest(); return; }
    tipDebounce = setTimeout(async () => {
      const my = ++tipSeq;
      try {
        const resp = await fetch('/api/inputtips?keywords=' + encodeURIComponent(kw));
        const data = await resp.json();
        if (my !== tipSeq) return;
        renderSuggest(data.tips || []);
      } catch (err) { hideSuggest(); }
    }, 200);
  });
  addressEl.addEventListener('keydown', (e) => {
    const open = suggestEl.style.display === 'block' && tips.length;
    if (e.key === 'ArrowDown' && open) { e.preventDefault(); setActive((active + 1) % tips.length); }
    else if (e.key === 'ArrowUp' && open) { e.preventDefault(); setActive((active - 1 + tips.length) % tips.length); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      if (open) selectTip(active >= 0 ? tips[active] : tips[0]);
      else doSearch();
    } else if (e.key === 'Escape') { hideSuggest(); }
  });
  document.addEventListener('mousedown', (e) => {
    if (!document.getElementById('search').contains(e.target)) hideSuggest();
  });

  async function doSearch() {
    const addr = addressEl.value.trim();
    if (!addr) return;
    hideSuggest();
    document.getElementById('status').textContent = '搜索地址…';
    try {
      const resp = await fetch('/api/geocode?address=' + encodeURIComponent(addr));
      const data = await resp.json();
      if (!resp.ok) { document.getElementById('status').textContent = data.message || '未找到'; return; }
      state.lng = data.lng; state.lat = data.lat; state.zoom = 17;
      draw(); schedulePreview();
      document.getElementById('status').textContent = data.formatted || addr;
    } catch (e) {
      document.getElementById('status').textContent = '搜索失败';
    }
  }

  window.addEventListener('resize', () => { resize(); draw(); schedulePreview(); });
  resize();
  draw();
  schedulePreview();
})();
</script>
</body>
</html>
